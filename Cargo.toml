[package]
name = "paint-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native desktop raster editor"
license = "MIT OR Apache-2.0"

[package.metadata.bundle]
name = "Paint Rust"
identifier = "net.trelak.PaintRust"
icon = ["assets/app-icon.png"]

[dependencies]
fs2 = "0.4"
ab_glyph = "0.2"
arboard = "3.7"
egui_extras = { version = "=0.33.3", default-features = false, features = ["svg"] }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "__screenshot"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
rfd = "0.15"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["wayland-csd-adwaita"] }
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
futures-lite = "2"
